# Linux Privilege Escalation Lab
# Attacker + vulnerable targets on a shared bridge network.
# Grow this file one target at a time as you add attack types.

services:
  attacker:
    build: ./attacker
    container_name: attacker
    hostname: attacker
    networks: [labnet]
    tty: true
    stdin_open: true
    cap_add:
      - NET_RAW        # let nmap do raw-packet scans
      - NET_ADMIN

  target-cron:
    build: ./targets/cron
    container_name: target-cron
    hostname: target-cron
    networks: [labnet]
    # CHAPTER 02 "The 60-Second Window" -- five cron paths to root:
    #   A world-writable cron script | B writable sourced config
    #   C writable drop directory    | D PATH hijack in cron
    #   E wildcard (tar) injection
    # Goal: read /root/flag.txt. cron fires every minute; the daemon is
    # started by entrypoint.sh (without it, none of the paths can ever fire).

  target-suid:
    build: ./targets/suid
    container_name: target-suid
    hostname: target-suid
    networks: [labnet]
    # CHAPTER 01 "Set & Forget" -- five SUID paths to root:
    #   A GTFOBins find | B GTFOBins python | C PATH hijack
    #   D command injection | E shared-object (writable RPATH dir)
    # Goal: read /root/flag.txt

  target-path:
    build: ./targets/path
    container_name: target-path
    hostname: target-path
    networks: [labnet]
    # CHAPTER 04 "PATH Hijacking" -- three new paths on this host:
    #   C sudo wrapper sets PATH then calls df
    #   D service PATH, run every 20s by rtr-unit-runner
    #   E writable /etc/environment sourced before uname
    # Stations A and B are the existing SUID and cron PATH labs.
    # Goal: read /root/flag.txt

  target-sudo:
    build: ./targets/sudo
    container_name: target-sudo
    hostname: target-sudo
    networks: [labnet]
    # CHAPTER 03 "The Trusted Shortcut" -- five sudo paths to root:
    #   A NOPASSWD on GTFOBins binary (find)
    #   B NOPASSWD on world-writable script
    #   C env_keep preserves LD_PRELOAD
    #   D sudoers wildcard + symlink
    #   E eval injection in sudo'd script
    # Goal: read /root/flag.txt

networks:
  labnet:
    driver: bridge
