# Linux Privilege Escalation Lab
# Attacker + vulnerable targets on a shared bridge network.
# Grow this file one target at a time as you add attack types.

services:
  attacker:
    build: ./attacker
    container_name: attacker
    hostname: attacker
    networks: [labnet]
    tty: true
    stdin_open: true
    cap_add:
      - NET_RAW        # let nmap do raw-packet scans
      - NET_ADMIN

  target-cron:
    build: ./targets/cron
    container_name: target-cron
    hostname: target-cron
    networks: [labnet]
    # CHAPTER 02 "The 60-Second Window" -- five cron paths to root:
    #   A world-writable cron script | B writable sourced config
    #   C writable drop directory    | D PATH hijack in cron
    #   E wildcard (tar) injection
    # Goal: read /root/flag.txt. cron fires every minute; the daemon is
    # started by entrypoint.sh (without it, none of the paths can ever fire).

  target-suid:
    build: ./targets/suid
    container_name: target-suid
    hostname: target-suid
    networks: [labnet]
    # CHAPTER 01 "Set & Forget" -- five SUID paths to root:
    #   A GTFOBins find | B GTFOBins python | C PATH hijack
    #   D command injection | E shared-object (writable RPATH dir)
    # Goal: read /root/flag.txt

  target-path:
    build: ./targets/path
    container_name: target-path
    hostname: target-path
    networks: [labnet]
    # CHAPTER 04 "PATH Hijacking" -- three new paths on this host:
    #   C sudo wrapper sets PATH then calls df
    #   D service PATH, run every 20s by rtr-unit-runner
    #   E writable /etc/environment sourced before uname
    # Stations A and B are the existing SUID and cron PATH labs.
    # Goal: read /root/flag.txt

  target-sudo:
    build: ./targets/sudo
    container_name: target-sudo
    hostname: target-sudo
    networks: [labnet]
    # CHAPTER 03 "The Trusted Shortcut" -- five sudo paths to root:
    #   A NOPASSWD on GTFOBins binary (find)
    #   B NOPASSWD on world-writable script
    #   C env_keep preserves LD_PRELOAD
    #   D sudoers wildcard + symlink
    #   E eval injection in sudo'd script
    # Goal: read /root/flag.txt

  target-web:
    build: ./targets/web
    container_name: target-web
    hostname: target-web
    networks: [labnet]
    # Map the app to the host so the learner exploits from their own browser +
    # Burp. Bound to loopback only -- never expose this box off the machine.
    # Default host port 8080; override if it clashes (e.g. Burp's own 8080):
    #   HOLLOW_PORT=8081 make up-web
    ports:
      - "127.0.0.1:${HOLLOW_PORT:-8080}:80"
    # CHAPTER 09 "Foothold" -- a vulnerable web app ("Hollow Share") with SIX
    # routes to code execution, each landing a reverse shell as www-data:
    #   A unrestricted file upload        D LFI -> RCE (log poison / wrappers)
    #   B upload filter bypass            E SSTI (Twig)
    #   C OS command injection            F PHP insecure deserialization
    # Then www-data -> root via `sudo php`.  Foothold: /var/www/flag.txt
    # Goal: read /root/flag.txt. Reverse shells call back to the attacker box.

  target-caps:
    build: ./targets/caps
    container_name: target-caps
    hostname: target-caps
    networks: [labnet]
    # cap_dac_read_search is NOT in Docker's default set; Station C's capped
    # `tar` binary needs it in the container bounding set to exec. The other
    # four stations work without it.
    cap_add:
      - DAC_READ_SEARCH
    # CHAPTER 05 "Capabilities" -- five file-capability paths to root:
    #   A cap_setuid on python3 | B cap_setuid on perl
    #   C cap_dac_read_search on tar (read the flag, no shell)
    #   D cap_dac_override on a writer (-> sudoers) | E cap_setuid on svc-runner
    # Goal: read /root/flag.txt.  getcap -r / is the surface.

  target-wild:
    build: ./targets/wild
    container_name: target-wild
    hostname: target-wild
    networks: [labnet]
    # CHAPTER 06 "Wildcard Expansion" -- four argument-injection paths to root,
    # fired by root cron every minute:
    #   A tar --checkpoint-action | B rsync -e remote shell
    #   C chown --reference (sticky dir) | D chmod --reference (sticky dir)
    # Goal: read /root/flag.txt. The shell expands * before the program runs.

  target-pivot:
    build: ./targets/pivot
    container_name: target-pivot
    hostname: target-pivot
    networks: [labnet]
    # CHAPTER 07 "Local Service + Port Forwarding" -- two loopback-only root
    # services reached by tunnelling, both ending in RCE as root:
    #   A  ssh -L  -> internal web app on :8080, command injection -> RCE as root
    #   B  ssh -R  -> publish your server onto target:9000 -> root updater runs it
    # Goal: read /root/flag.txt. The win is a service, not a file.

  target-docker:
    build: ./targets/docker
    container_name: target-docker
    hostname: target-docker
    networks: [labnet]
    # Runs its OWN Docker daemon (docker-in-docker) so the "host" you take over
    # is this container. That needs a privileged container.
    privileged: true
    # CHAPTER 08 "Docker socket" -- the docker group is root, three ways:
    #   A docker run -v /:/host chroot cat | B SUID bash persistence
    #   C the raw /var/run/docker.sock HTTP API via curl
    # Goal: read /root/flag.txt. The socket IS the privilege.

networks:
  labnet:
    driver: bridge
