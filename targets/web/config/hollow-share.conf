# Apache config for the "Hollow Share" portal (Chapter 09).
# Loaded as a conf-enabled drop-in; DocumentRoot stays /var/www/html.
#
# === PLANTED VULNERABILITY (Station B support) =============================
# Two deliberate server-side mistakes make the upload-filter bypass work:
#   1. AddHandler maps several PHP-capable extensions (and, via mod_mime's
#      "any extension component" matching, double extensions like x.php.jpg)
#      to the PHP interpreter in the shares/ gallery dir.
#   2. AllowOverride All lets an uploaded .htaccess turn .jpg into PHP.
# ==========================================================================

<Directory /var/www/html/shares>
    # mod_mime: a file is handed to PHP if ANY of its extension components is
    # one of these — so shell.pht, shell.php5, and shell.php.jpg all execute.
    AddHandler application/x-httpd-php .php .phtml .php5 .pht .phar
    AllowOverride All
    Require all granted
</Directory>

# The unrestricted uploads dir (Station A). PHP execution is on by default
# under the document root; this block just documents and serves it.
<Directory /var/www/html/uploads>
    AllowOverride None
    Require all granted
</Directory>
