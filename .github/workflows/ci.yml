name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: catch base-image + tool-download drift
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build all lab images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build attacker + all targets
        run: docker compose build

  suid-lab:
    name: SUID lab — five paths to root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the SUID target
        run: docker compose build target-suid

      - name: Start the SUID target
        run: docker compose up -d target-suid

      - name: Exploit all five SUID stations and assert root + flag
        run: |
          docker cp tests/verify_suid.sh target-suid:/tmp/verify_suid.sh
          docker exec target-suid chmod 755 /tmp/verify_suid.sh
          docker exec -u labuser1 target-suid bash /tmp/verify_suid.sh

      - name: Tear down
        if: always()
        run: docker compose down -v

  cron-lab:
    name: Cron lab — five paths to root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the cron target
        run: docker compose build target-cron

      - name: Start the cron target
        run: docker compose up -d target-cron

      - name: Arm all five cron stations, wait for cron, assert root + flag
        # Jobs fire every minute, so give the test up to ~3 min for all 5 ticks.
        timeout-minutes: 5
        run: |
          docker cp tests/verify_cron.sh target-cron:/tmp/verify_cron.sh
          docker exec target-cron chmod 755 /tmp/verify_cron.sh
          docker exec -u labuser1 target-cron bash /tmp/verify_cron.sh

      - name: Tear down
        if: always()
        run: docker compose down -v

  sudo-lab:
    name: Sudo lab — five paths to root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the sudo target
        run: docker compose build target-sudo

      - name: Start the sudo target
        run: docker compose up -d target-sudo

      - name: Exploit all five sudo stations and assert root + flag
        run: |
          docker cp tests/verify_sudo.sh target-sudo:/tmp/verify_sudo.sh
          docker exec target-sudo chmod 755 /tmp/verify_sudo.sh
          docker exec -u labuser1 target-sudo bash /tmp/verify_sudo.sh

      - name: Tear down
        if: always()
        run: docker compose down -v

  path-lab:
    name: PATH lab — three paths to root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the PATH target
        run: docker compose build target-path

      - name: Start the PATH target
        run: docker compose up -d target-path

      - name: Exploit the three PATH stations and assert root + flag
        timeout-minutes: 3
        run: |
          docker cp tests/verify_path.sh target-path:/tmp/verify_path.sh
          docker exec target-path chmod 755 /tmp/verify_path.sh
          docker exec -u labuser1 target-path bash /tmp/verify_path.sh

      - name: Tear down
        if: always()
        run: docker compose down -v

  web-lab:
    name: Web lab — six RCE routes + reverse shell to root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the attacker + web target
        run: docker compose build attacker target-web

      - name: Start the attacker + web target
        run: docker compose up -d attacker target-web

      - name: Exploit all six web routes, land a reverse shell, assert root + flag
        # Six curl-driven RCEs + one real /dev/tcp reverse shell to the attacker.
        timeout-minutes: 5
        run: |
          docker cp tests/verify_web.sh attacker:/tmp/verify_web.sh
          docker exec attacker chmod 755 /tmp/verify_web.sh
          docker exec attacker bash /tmp/verify_web.sh target-web

      - name: Tear down
        if: always()
        run: docker compose down -v

  caps-lab:
    name: Capabilities lab — five paths to root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the capabilities target
        run: docker compose build target-caps

      - name: Start the capabilities target
        run: docker compose up -d target-caps

      - name: Exploit all five capability stations and assert root + flag
        run: |
          docker cp tests/verify_caps.sh target-caps:/tmp/verify_caps.sh
          docker exec target-caps chmod 755 /tmp/verify_caps.sh
          docker exec -u labuser1 target-caps bash /tmp/verify_caps.sh

      - name: Tear down
        if: always()
        run: docker compose down -v

  wild-lab:
    name: Wildcard lab — four paths to root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the wildcard target
        run: docker compose build target-wild

      - name: Start the wildcard target
        run: docker compose up -d target-wild

      - name: Arm all four wildcard stations, wait for cron, assert root + flag
        # tar/rsync fire on one tick; chown/chmod need two (flip, then execute).
        timeout-minutes: 7
        run: |
          docker cp tests/verify_wild.sh target-wild:/tmp/verify_wild.sh
          docker exec target-wild chmod 755 /tmp/verify_wild.sh
          docker exec -u labuser1 target-wild bash /tmp/verify_wild.sh

      - name: Tear down
        if: always()
        run: docker compose down -v

  pivot-lab:
    name: Pivot lab — local + remote port forwarding to root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the attacker + pivot target
        run: docker compose build attacker target-pivot

      - name: Start the attacker + pivot target
        run: docker compose up -d attacker target-pivot

      - name: Tunnel to the loopback services (-L and -R) and assert root + flag
        # -L to root Redis -> authorized_keys; -R publishing a payload to the
        # root updater. The -R path waits on a cron tick.
        timeout-minutes: 5
        run: |
          docker cp tests/verify_pivot.sh attacker:/tmp/verify_pivot.sh
          docker exec attacker chmod 755 /tmp/verify_pivot.sh
          docker exec attacker bash /tmp/verify_pivot.sh target-pivot

      - name: Tear down
        if: always()
        run: docker compose down -v

  docker-lab:
    name: Docker-socket lab — docker group is root, three ways
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the docker-socket target
        run: docker compose build target-docker

      - name: Start the docker-socket target (privileged dind)
        run: docker compose up -d target-docker

      - name: Exploit the socket three ways and assert root + flag
        # Inner dockerd needs a few seconds; the self-test waits for it.
        timeout-minutes: 5
        run: |
          docker cp tests/verify_docker.sh target-docker:/tmp/verify_docker.sh
          docker exec target-docker chmod 755 /tmp/verify_docker.sh
          docker exec -u labuser1 target-docker bash /tmp/verify_docker.sh

      - name: Tear down
        if: always()
        run: docker compose down -v
