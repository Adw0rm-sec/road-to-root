version: 2
updates:
  # Keep the CI actions current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Keep the lab base images current (ubuntu:24.04, etc.)
  - package-ecosystem: docker
    directories:
      - /attacker
      - /targets/suid
      - /targets/cron
    schedule:
      interval: weekly
    commit-message:
      prefix: docker
